name: CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（升级到了支持 Node.js 24 的 v6）
      - uses: actions/checkout@v6

      # 2. 安装 Node.js（升级到了支持 Node.js 24 的 v6）
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20 # 或你项目需要的版本

      # 3. 安装依赖 + 构建项目（关键！这里生成安装包/静态文件）
      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # 你的项目构建命令，比如 npm run build / yarn build

      # 4. 上传构建产物到 GitHub（关键！这样 Artifacts 里就有文件了）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v5 # 支持 Node.js 24 的版本
        with:
          name: pv-sales-calculator-build # 制品名称，随便取
          path: dist/ # 构建产物的目录，比如 Vue/React 默认是 dist/
          retention-days: 7 # 制品保存7天，可修改
