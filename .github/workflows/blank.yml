name: Build APK

on:
  push:
    branches: [ "main", master ]
  pull_request:
    branches: [ "main", master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Find project directory
      id: finddir
      run: |
        if [ -f "settings.gradle.kts" ]; then
          echo "dir=." >> $GITHUB_OUTPUT
        elif [ -f "PVSalesCalculator/settings.gradle.kts" ]; then
          echo "dir=PVSalesCalculator" >> $GITHUB_OUTPUT
        elif [ -f "app/settings.gradle.kts" ]; then
          echo "dir=app" >> $GITHUB_OUTPUT
        else
          echo "dir=$(find . -name 'settings.gradle.kts' -not -path '*/\.*' | head -1 | xargs dirname)" >> $GITHUB_OUTPUT
        fi
        echo "Project directory: $(cat $GITHUB_OUTPUT | grep dir)"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        cd ${{ steps.finddir.outputs.dir }}
        if [ ! -f "gradlew" ]; then
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
        fi
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
        fi
        if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          mkdir -p gradle/wrapper
          echo 'distributionBase=GRADLE_USER_HOME' > gradle/wrapper/gradle-wrapper.properties
          echo 'distributionPath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip' >> gradle/wrapper/gradle-wrapper.properties
          echo 'zipStoreBase=GRADLE_USER_HOME' >> gradle/wrapper/gradle-wrapper.properties
          echo 'zipStorePath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        cd ${{ steps.finddir.outputs.dir }}
        ./gradlew assembleDebug --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ steps.finddir.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
